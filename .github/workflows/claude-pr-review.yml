name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run on PR comments or PR events
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --permission-mode allow-all
          prompt: |
            Review the changes in this pull request by:
            1. Use `gh pr view --json files` to see what files changed
            2. Use `gh pr diff` to see the diff
            3. Read the changed files and analyze them

            Focus your review on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security concerns
            - Performance implications
            - Suggestions for improvement

            Post detailed review comments using `gh pr review` with inline comments on specific issues you find.
